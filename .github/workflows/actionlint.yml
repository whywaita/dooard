name: actionlint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  actionlint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install actionlint
        run: |
          curl -sSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz | tar -xz
          install -m 755 actionlint /usr/local/bin/actionlint
      - name: Run actionlint
        run: actionlint .github/workflows/*.yml
      - name: Run workflow policy tests
        run: bash test/test_tagpr_workflow.sh

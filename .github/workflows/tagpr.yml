name: tagpr

on:
  push:
    branches:
      - main

jobs:
  tagpr:
    runs-on: ubuntu-latest
    outputs:
      tagpr-tag: ${{ steps.run-tagpr.outputs.tag }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: run-tagpr
        name: Run tagpr
        uses: Songmu/tagpr@9bbb945b2fb025126186661e27d55485e3fc6df6 # v1.18.3

  firmware:
    needs: tagpr
    if: needs.tagpr.outputs.tagpr-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: uv sync --python 3.14
      - run: uv pip install pip setuptools wheel
      - name: Build firmware
        run: |
          version="${NEEDS_TAGPR_TAG#v}"
          DOOARD_FIRMWARE_VERSION="${version}" uv run pio run -e core2
        env:
          NEEDS_TAGPR_TAG: ${{ needs.tagpr.outputs.tagpr-tag }}
      - name: Prepare firmware artifact
        run: |
          mkdir -p public/firmware
          cp .pio/build/core2/firmware.bin public/firmware/firmware.bin
          version="${NEEDS_TAGPR_TAG#v}"
          sha256="$(sha256sum public/firmware/firmware.bin | awk '{print $1}')"
          size_bytes="$(wc -c < public/firmware/firmware.bin | tr -d ' ')"
          cat > public/firmware/version.json <<EOF
          {
            "version": "${version}",
            "firmware_url": "https://whywaita.github.io/dooard/firmware/firmware.bin",
            "sha256": "${sha256}",
            "size_bytes": ${size_bytes}
          }
          EOF
        env:
          NEEDS_TAGPR_TAG: ${{ needs.tagpr.outputs.tagpr-tag }}
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
